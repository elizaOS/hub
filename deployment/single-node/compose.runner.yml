# Forgejo Actions runner for a single-node deployment.
#
# Isolation rules this file exists to enforce:
#   - The runner never sees the host Docker socket. It talks to a private
#     dockerd whose only client is this runner.
#   - Neither service publishes a port. The dockerd TCP endpoint is reachable
#     only on the internal compose network.
#   - Jobs run in containers, never on the host, so no `:host` labels.
#
# Register the runner against an ORGANISATION, not the whole instance, so that
# arbitrary public repositories on a hub with open registration cannot execute
# code on it. Get a token from
#   /api/v1/orgs/<org>/actions/runners/registration-token
# and pass it as RUNNER_REGISTRATION_TOKEN on first start.
services:
  runner-docker:
    image: docker:27-dind
    restart: unless-stopped
    privileged: true
    command: ["dockerd", "-H", "tcp://0.0.0.0:2375", "--tls=false"]
    environment:
      DOCKER_TLS_CERTDIR: ""
    networks: [runner]
    volumes:
      - runner-docker-data:/var/lib/docker
    healthcheck:
      test: ["CMD", "docker", "-H", "tcp://127.0.0.1:2375", "info"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  runner:
    image: data.forgejo.org/forgejo/runner:12
    restart: unless-stopped
    depends_on:
      # Waiting for the container to start is not enough: dockerd takes seconds
      # to listen, and a runner that starts first fails every job it claims in
      # that window.
      runner-docker:
        condition: service_healthy
    environment:
      DOCKER_HOST: tcp://runner-docker:2375
      # Consumed by the entrypoint below on first registration only.
      RUNNER_REGISTRATION_TOKEN: "${RUNNER_REGISTRATION_TOKEN:?set RUNNER_REGISTRATION_TOKEN}"
      FORGEJO_INSTANCE_URL: "${FORGEJO_INSTANCE_URL:-http://server:3000}"
      RUNNER_NAME: "${RUNNER_NAME:-eliza-hub-runner-1}"
      RUNNER_LABELS: "${RUNNER_LABELS:-docker:docker://node:22-bookworm,ubuntu-latest:docker://node:22-bookworm}"
    networks: [runner, forgejo]
    volumes:
      - runner-data:/data
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        cd /data
        if [ ! -f .runner ]; then
          forgejo-runner register --no-interactive \
            --instance "$${FORGEJO_INSTANCE_URL}" \
            --token "$${RUNNER_REGISTRATION_TOKEN}" \
            --name "$${RUNNER_NAME}" \
            --labels "$${RUNNER_LABELS}"
        fi
        exec forgejo-runner daemon

networks:
  # Not marked internal: the job dockerd must reach image registries, and jobs
  # themselves need package registries. Inbound exposure is prevented by
  # publishing no ports, not by cutting egress. Per-job network restriction for
  # untrusted pull-request code is a separate control, not this network's job.
  runner:
  forgejo:
    external: false

volumes:
  runner-docker-data:
  runner-data:
